[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # scripts use `node --env-file-if-exists` (Node 22.9+)
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Local/test-only database engine; never loaded when DATABASE_URL is a postgres:// URL
  # sharp ships native binaries, so it must be installed rather than bundled
  external_node_modules = ["@electric-sql/pglite", "sharp"]

# `npm run dev` → Netlify CLI proxies Vite (5173) and serves functions on :8888
[dev]
  command = "npx vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# Clean admin URLs
[[redirects]]
  from = "/admin/login"
  to = "/admin/login.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SAMEORIGIN (not DENY): the admin Appearance page previews the homepage in an iframe
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
